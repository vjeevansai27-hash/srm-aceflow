[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/srm-proxy"
  to = "/.netlify/functions/srm-proxy"
  status = 200

[[redirects]]
  from = "/api/db/*"
  to = "/.netlify/functions/db?action=:splat"
  status = 200

[[redirects]]
  from = "/api/db"
  to = "/.netlify/functions/db"
  status = 200

[[redirects]]
  from = "/api/client-log"
  to = "/.netlify/functions/client-log"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
